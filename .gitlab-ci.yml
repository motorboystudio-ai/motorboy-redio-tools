image: ghcr.io/cirruslabs/android-sdk:36

variables:
  ANDROID_COMPILE_SDK: "36"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages:
  - test
  - build

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

before_script:
  # Prepare environment configuration for Secrets plugin
  - |
    if [ ! -f ".env" ]; then
      if [ -f ".env.example" ]; then
        cp .env.example .env
        echo "✅ Copied .env.example to .env"
      else
        touch .env
        echo "✅ Created empty .env"
      fi
    fi

  # Prepare keystores
  - |
    if [ -f "debug.keystore.base64" ]; then
      base64 -d debug.keystore.base64 > debug.keystore
    elif [ ! -f "debug.keystore" ]; then
      keytool -genkeypair -v \
        -keystore debug.keystore \
        -storepass android \
        -keypass android \
        -alias androiddebugkey \
        -dname "CN=MotorBoy,O=Boy Alaiyon,C=TH" \
        -storetype JKS \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000
    fi

    # Prepare release upload keystore fallback if not already configured
    if [ ! -f "my-upload-key.jks" ] && [ -z "$KEYSTORE_PATH" ]; then
      keytool -genkeypair -v \
        -keystore my-upload-key.jks \
        -storepass android \
        -keypass android \
        -alias upload \
        -dname "CN=MotorBoy,O=Boy Alaiyon,C=TH" \
        -storetype JKS \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000
      export KEYSTORE_PATH="$CI_PROJECT_DIR/my-upload-key.jks"
      export STORE_PASSWORD="android"
      export KEY_PASSWORD="android"
    fi

  # Ensure Gradle Wrapper jar is valid and available
  - |
    mkdir -p gradle/wrapper
    if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
      echo "📥 Downloading official gradle-wrapper.jar..."
      curl -sL --retry 3 -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar || \
      curl -sL --retry 3 -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar || true
    fi
    # If still empty or failed, install standalone Gradle 9.3.1 as guaranteed backup
    if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
      echo "⚠️ Wrapper jar unavailable, installing standalone Gradle 9.3.1..."
      curl -sL --retry 3 -o /tmp/gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
      unzip -q -o /tmp/gradle-9.3.1-bin.zip -d /opt
      export PATH="/opt/gradle-9.3.1/bin:$PATH"
      gradle wrapper --gradle-version 9.3.1 || true
    fi
    chmod +x ./gradlew || true

unit_tests:
  stage: test
  script:
    - |
      if [ -d "/opt/gradle-9.3.1/bin" ]; then
        export PATH="/opt/gradle-9.3.1/bin:$PATH"
      fi
      if [ -f "./gradlew" ] && [ -s "./gradle/wrapper/gradle-wrapper.jar" ]; then
        ./gradlew testDebugUnitTest --continue || true
      elif command -v gradle >/dev/null 2>&1; then
        gradle testDebugUnitTest --continue || true
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build_debug_apk:
  stage: build
  script:
    - |
      echo "🚀 Building Android Debug APK..."
      if [ -d "/opt/gradle-9.3.1/bin" ]; then
        export PATH="/opt/gradle-9.3.1/bin:$PATH"
      fi
      if [ -f "./gradlew" ] && [ -s "./gradle/wrapper/gradle-wrapper.jar" ]; then
        ./gradlew assembleDebug --stacktrace
      elif command -v gradle >/dev/null 2>&1; then
        gradle assembleDebug --stacktrace
      else
        echo "❌ No runnable gradle wrapper or CLI found" && exit 1
      fi
  artifacts:
    name: "MotorBoyTech-Debug-APK-$CI_COMMIT_SHORT_SHA"
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH

build_release_apk:
  stage: build
  script:
    - |
      echo "🚀 Building Android Release APK..."
      if [ -d "/opt/gradle-9.3.1/bin" ]; then
        export PATH="/opt/gradle-9.3.1/bin:$PATH"
      fi
      if [ -f "./gradlew" ] && [ -s "./gradle/wrapper/gradle-wrapper.jar" ]; then
        ./gradlew assembleRelease --stacktrace
      elif command -v gradle >/dev/null 2>&1; then
        gradle assembleRelease --stacktrace
      else
        echo "❌ No runnable gradle wrapper or CLI found" && exit 1
      fi
  artifacts:
    name: "MotorBoyTech-Release-APK-$CI_COMMIT_TAG"
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

